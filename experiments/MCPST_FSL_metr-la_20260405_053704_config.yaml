experiment:
  device: auto
  log_dir: logs
  name: mcpst_fsl_traffic_prediction
  plot_dir: plots
  save_dir: experiments
  seed: 42
few_shot:
  adaptation_steps: 8
  enabled: true
  gradient_clip_inner: 1.0
  gradient_clip_outer: 1.0
  inner_lr: 0.01
  meta_epochs: 100
  num_tasks: 4
  outer_lr: 0.001
  query_size: 16
  support_size: 12
logging:
  checkpoint_frequency: 10
  level: INFO
  plot_physics_features: true
  plot_predictions: true
  plot_training_curves: true
  save_metrics: true
  save_model_checkpoints: true
model:
  dropout: 0.1
  hidden_dim: 16
  input_dim: 6
  name: MCPST_FSL
  node_minibatch_cpu: 4096
  node_minibatch_gpu: 1024
  num_diffusion_steps: 6
  num_eigen_vectors: 8
  num_oscillator_steps: 10
  physics:
    alpha_consistency: 0.015
    alpha_coupling: 0.05
    alpha_flow: 2.0
    alpha_physics: 0.03
    alpha_spatial: 0.08
    alpha_temporal: 0.08
    alpha_uncertainty: 0.01
  pred_len: 12
  spatial_dim: 2
task:
  batch_size: 8
  his_num: 12
  pred_num: 12
  test_batch_size: 8
training:
  add_physics_features: true
  batch_size: 8
  early_stopping:
    min_delta: 1e-5
    patience: 20
    restore_best_weights: true
  epochs: 300
  gradient_clip: 1.0
  learning_rate: 0.0003
  minibatch_size: 4096
  scheduler:
    factor: 0.7
    min_lr: 1e-6
    patience: 10
    type: plateau
  source_epochs: 250
  source_lr: 0.0003
  target_days: 3
  target_epochs: 250
  target_lr: 0.0001
  test_batch_size: 8
  test_dataset: metr-la
  weight_decay: 1e-4
validation:
  shuffle: false
  split_ratio: 0.8
