#   learning_rate: 0.0003
#   weight_decay: 1e-4
#   gradient_clip: 1.0

#   # -----------------------------------------------------------------------
#   # Sample-level minibatch size: maximum number of dataset samples processed
#   # in a single forward/backward pass (gradient accumulation is used when a
#   # batch is larger than this value).
#   #
#   # Source __getitem__ draws this many samples per step; __len__ is scaled
#   # down proportionally so total training data per epoch stays constant.
#   # The test DataLoader also uses this as its batch_size for efficient
#   # inference (fewer, larger batches → less DataLoader overhead).
#   #
#   # Override at runtime with:  python main.py --minibatch_size 2048
#   #
#   # Recommended defaults (also applied automatically by main.py if absent):
#   #   GPU → 2048   (bounded VRAM usage)
#   #   CPU → 4096   (better gradient estimates, lower kernel-launch overhead)
#   # -----------------------------------------------------------------------
#   minibatch_size: 4096

