model:
  name: MCPST_FSL
  input_dim: 6
  hidden_dim: 64
  pred_len: 12
  spatial_dim: 2
  num_diffusion_steps: 6
  num_oscillator_steps: 10
  num_eigen_vectors: 8
  dropout: 0.1
  node_minibatch_cpu: 4096
  node_minibatch_gpu: 1024
  physics:
    alpha_flow: 2.0
    alpha_spatial: 0.08
    alpha_temporal: 0.08
    alpha_physics: 0.03
    alpha_consistency: 0.015
    alpha_uncertainty: 0.01
    alpha_coupling: 0.05

few_shot:
  enabled: true
  support_size: 5
  query_size: 10
  meta_epochs: 100
  inner_lr: 0.01
  outer_lr: 0.0005
  num_tasks: 1
  adaptation_steps: 3
  meta_batch_size: 1
  gradient_accumulation_steps: 5
  gradient_clip_inner: 1.0
  gradient_clip_outer: 1.0

training:
  epochs: 300
  source_epochs: 250
  source_lr: 0.0003
  target_epochs: 250
  target_lr: 0.0001
  batch_size: 1
  test_batch_size: 1
  learning_rate: 0.0003
  weight_decay: 1e-4
  gradient_clip: 1.0
  minibatch_size: 2048
  test_dataset: metr-la
  target_days: 3
  add_physics_features: true

task:
  his_num: 12
  pred_num: 12
  batch_size: 1
  test_batch_size: 1